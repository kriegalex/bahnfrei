# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (c) 2026 Bahnfrei contributors
#
# TASK-002 CI gates (SYS-140, SYS-141, ADR-001 §3–4): 3-OS build matrix,
# lint, TS typecheck, tests + coverage thresholds, dependency licence scan,
# vulnerability scan. Governance gates (SPDX/DCO) live in governance.yml.
# style-conformance (TASK-032, SYS-116) is the design-token gate; sast
# (gosec, SYS-092, OQ-078) is the own-code security scan.
# scripts/check-gate.sh reproduces this workflow locally — keep them in sync.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs on the same ref are cancelled (except on main, where every
# push must produce a complete gate record).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # -shuffle=on guards against inter-test order dependence (hidden
      # shared state); the seed is printed on failure for reproduction.
      - run: go test -shuffle=on ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with race detector and coverage
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Enforce SYS-140 coverage gates
        run: ./scripts/check-coverage.sh coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pinned: an unpinned "latest" turned main red twice when new linter
      # versions landed mid-stream (2026-07-10, 2026-07-14). Bump deliberately
      # in its own commit, fixing new findings in the same change.
      # v2.12.2 has an SA5011 regression (t.Fatal no longer modeled as
      # terminating, false positives on nil-guarded test code) — stay on
      # v2.12.1 until a fixed release is verified.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Own-code security SAST (SYS-092, closes OQ-078); complements
      # govulncheck's dependency half. Every accepted finding carries an
      # inline justified "#nosec Gxxx -- reason". Pinned — keep in lockstep
      # with GOSEC_VERSION in scripts/check-gate.sh.
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -exclude-generated ./...

  style-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Design-token conformance check (TASK-032, SYS-116, UC-038 #1)
        run: ./scripts/check-style-tokens.sh

  typecheck-islands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tsc --noEmit for every TS island
        run: |
          found=0
          while IFS= read -r cfg; do
            found=1
            dir=$(dirname "$cfg")
            echo "typechecking $dir"
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm ci)
            fi
            npx --yes -p typescript tsc -p "$cfg" --noEmit
          done < <(find . -name tsconfig.json -not -path '*/node_modules/*')
          if [ "$found" -eq 0 ]; then
            echo "no TypeScript islands yet (first arrive with TASK-005) — nothing to typecheck"
          fi

  islands-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Rebuild TS islands and verify the committed JS is fresh
        run: |
          ./scripts/build-islands
          git diff --exit-code internal/web/static

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps
      - name: UC-034 browser E2E suite (SYS-085/086/087)
        working-directory: e2e
        run: npm run test:e2e

  licence-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Dependency licence allowlist (ADR-001 §4)
        run: |
          go install github.com/google/go-licenses@latest
          # modernc.org/mathutil is BSD-3-Clause (LICENSE in module root,
          # verified manually 2026-07-06) — the classifier fails to detect it.
          go-licenses check ./... \
            --ignore github.com/kriegalex/bahnfrei \
            --ignore modernc.org/mathutil \
            --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0,Unlicense,CC0-1.0

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: govulncheck (SYS-141)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
